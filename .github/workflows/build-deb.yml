name: Build and Release DEB Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set required file permissions
        run: |
          mkdir -p package/usr/local/bin
          mkdir -p package/lib/systemd/system

          cp src/blockpihole/piholeblocker.py package/usr/local/bin/piholeblocker.py
       
          chmod 0755 package/DEBIAN/postinst
          chmod 0755 package/DEBIAN/prerm
          chmod 0755 package/DEBIAN/control
          
          chmod 0755 package/usr/local/bin/piholeblocker.py
          chmod 0644 package/lib/systemd/system/
          


      - name: Build .deb package
        run: dpkg-deb --build --root-owner-group package piholeblocker.deb

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: piholeblocker.deb
